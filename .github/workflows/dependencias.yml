# Instalar o quitar dependencias desde el CI, como alternativa a hacerlo en la máquina.
#
# POR QUÉ EXISTE. Nació para esquivar un problema que no existía: se comprobó que no había npm
# en el PATH por defecto y se concluyó "no hay npm en esta máquina". Sí hay (CLAUDE.md §1, con
# el comando al lado). Se queda igual, porque hace algo que la máquina no hace sola: corre
# lint, tests y build ANTES de commitear `package.json` + `package-lock.json` sincronizados.
# Ya no es el único camino; es la red.
#
# Se dispara A MANO desde la pestaña Actions, nunca solo: instalar una dependencia es una
# decisión, no algo que deba pasar por accidente.
name: Dependencias
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        required: true
        type: choice
        options: [instalar, quitar]
      paquetes:
        description: "Paquetes separados por espacio (ej: @sentry/react)"
        required: true
        type: string
      dev:
        description: "¿Es dependencia de desarrollo?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Los inputs entran por `env:` y NUNCA con `${{ }}` adentro de un `run:`.
      #
      # POR QUÉ. Lo que se escribe con `${{ }}` lo reemplaza Actions en el TEXTO del script
      # antes de que exista el shell, así que el valor deja de ser un dato y pasa a ser
      # programa: un paquete llamado `x; curl algo | sh` se ejecuta, con el token del repo y
      # permiso de escritura sobre `main`. Como variable de entorno el shell la expande
      # después de parsear, y lo que hay adentro ya no se vuelve a interpretar. Es el patrón
      # que documenta GitHub en "Security hardening for GitHub Actions → Understanding the
      # risk of script injections".
      #
      # El riesgo acá es bajo porque disparar el workflow ya exige permiso de escritura. Pero
      # convierte "puedo abrir un PR" en "ejecuto lo que quiera con el token", y esa diferencia
      # es la que importa.
      - name: Aplicar el cambio
        env:
          ACCION: ${{ inputs.accion }}
          PAQUETES: ${{ inputs.paquetes }}
          DEV: ${{ inputs.dev }}
        run: |
          # `set -f` apaga la expansión de comodines: `$PAQUETES` va sin comillas a propósito,
          # porque tiene que partirse en varios paquetes por espacios, y sin esto un nombre con
          # `*` se convertiría en la lista de archivos del repositorio.
          set -f
          if [ "$ACCION" = "instalar" ]; then
            if [ "$DEV" = "true" ]; then guardar=--save-dev; else guardar=--save; fi
            npm install "$guardar" $PAQUETES
          else
            npm uninstall $PAQUETES
          fi

      # Verificación ANTES de commitear. Una dependencia que rompe el build no entra: sin
      # este paso, el workflow podría dejar `main` en rojo y nadie se entera hasta el
      # siguiente push.
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # Mismo cuidado que arriba, y no es de más: el mensaje del commit se arma con comillas
      # dobles, así que un paquete que contenga una comilla cerraba la cadena y lo que venía
      # después corría como comando. Este paso es el que además hace `git push`.
      - name: Commitear el cambio
        env:
          ACCION: ${{ inputs.accion }}
          PAQUETES: ${{ inputs.paquetes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet package.json package-lock.json; then
            echo "No hubo cambios en las dependencias."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "chore: $ACCION $PAQUETES

          Aplicado desde el workflow Dependencias porque la maquina de trabajo
          no tiene npm. Lint, tests y build pasaron antes de commitear.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
