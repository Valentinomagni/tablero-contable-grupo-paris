name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Ambos specs (app.spec.ts y a11y.spec.ts) loguean con credenciales de una cuenta
      # de prueba ya seedeada en el Supabase real del proyecto (misma clave publishable
      # que usa la app en producción, ya versionada en src/lib/supabase.ts). No hay
      # secrets adicionales que configurar. webServer en playwright.config.ts levanta
      # `vite preview` en :8124 y channel:"chromium" (vía CI=true) evita depender de
      # Edge, que no está disponible en el runner ubuntu-latest.
      - run: npx playwright test
